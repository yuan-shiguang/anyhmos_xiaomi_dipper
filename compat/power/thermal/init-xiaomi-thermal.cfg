{
  "jobs": [
    {
      "name": "param:dipper-start-xiaomi-thermal",
      "condition": "dipper.debug.start.thermal=true",
      "cmds": [
        "start dipper_xiaomi_thermal"
      ]
    }
  ],
  "services": [
    {
      "name": "dipper_xiaomi_thermal",
      "path": [
        "/compat/bin/native_thermal_launcher",
        "/data/local/tmp/dipper-xiaomi-thermal/root"
      ],
      "uid": "root",
      "gid": [
        "root"
      ],
      "caps": [
        "SYS_CHROOT"
      ],
      "disabled": 1,
      "once": 0,
      "sandbox": 0,
      "saspawn": false,
      "start-mode": "condition"
    }
  ]
}
